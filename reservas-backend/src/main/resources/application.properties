spring.application.name=reservas-backend

# Conexion a PostgreSQL. Cambia el nombre de la base, el usuario y la clave por los de tu PostgreSQL,
# o definelos como variables de entorno (DB_URL, DB_USER, DB_PASSWORD) para no subir tu clave a GitHub.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgresReservaTransporte}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:0107}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.security.user.name=admin
spring.security.user.password=admin123