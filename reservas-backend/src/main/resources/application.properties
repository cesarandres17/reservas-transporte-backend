spring.application.name=reservas-backend
spring.config.import=optional:classpath:basedatos-local.properties,optional:classpath:correo-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgresReservaTransporte}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.admin.email=admin@reservas.com
app.admin.password=${ADMIN_PASSWORD:admin123}

spring.web.error.include-message=always

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.correo.habilitado=${MAIL_ENABLED:false}
app.correo.remitente=${MAIL_FROM:}
app.correo.redirigir-a=${MAIL_REDIRECT:}
